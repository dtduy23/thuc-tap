# ============================================================================
# nginx trong image web: phục vụ bản build tĩnh + chuyển tiếp ĐÚNG MỘT tiền tố
# /api sang container api. Bundle không cứng địa chỉ nào (vite.config.ts) nên
# một image dùng được cho mọi tên miền.
#
# TLS và tên miền do nginx/ingress ở ngoài lo. Container này chỉ nghe HTTP nội bộ.
# ============================================================================
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Trang lỗi 404 của SPA do router lo, không phải nginx.
  charset utf-8;
  client_max_body_size 64m; # tải tệp đính kèm lên (Mốc 4)

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # Chỉ trang chủ mới đặt các header này — đủ, vì chỉ index.html chạy script.
  # Nếu màn nào trắng vì bị chặn, sửa ở ĐÂY và ghi lý do, đừng bỏ cả dòng.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always; # GDOS không cho nhúng vào iframe lạ
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

  location /api/ {
    proxy_pass http://api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # IP thật của người dùng đi vào nhật ký phiên đăng nhập. API chỉ tin header
    # này từ địa chỉ khai trong TIN_PROXY (xem cau-hinh.ts) — không tin bừa.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # tóm tắt văn bản qua Native có thể lâu
  }

  # Tệp có băm trong tên (Vite) — giữ cache lâu; index.html thì không bao giờ.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
