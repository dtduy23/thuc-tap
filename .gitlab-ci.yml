# ============================================================================
# GDOS — GitLab CI/CD
#
#   build    dựng image api + web, đẩy lên registry của GitLab
#   deploy   đưa lên MÁY THỬ (bấm tay)
#
# CHỈ CHẠY Ở NHÁNH `develop` (người dùng chốt 30/09/2026) — xem `workflow` dưới.
#
# KHÔNG có chặng kiểm tra: người dùng chốt 30/09/2026 bỏ cả `kiem-tra`
# (lint · test · typecheck) lẫn `bao-mat` (gitleaks · pnpm audit) để pipeline
# đi thẳng từ mã nguồn sang image. Hệ quả phải biết:
#   - Test quyền và RLS KHÔNG còn chạy trong CI. `pnpm kiem-tra` ở máy vẫn là
#     cửa duy nhất — CLAUDE.md §3: phải xanh trước khi báo xong.
#   - Không còn ai quét bí mật lọt vào lịch sử git.
#
# HAI RUNNER, SHELL EXECUTOR (docs/FOXAI-CICD-Runbook.md của repo cũ):
#   `foxai-build`     máy build — dựng image, đẩy lên registry
#   `foxai-develop`   CHÍNH MÁY THỬ — nên deploy chạy tại chỗ, không SSH, không
#                     khóa, không host key. Ít thứ phải giữ bí mật hơn hẳn.
#   Shell executor BỎ QUA `image:` và không gắn tag → pipeline treo "stuck".
# ============================================================================

stages:
  - build
  - deploy

# Pipeline chỉ nổ ở `develop`. Nhánh mốc (`moc-*`) và `main` không chạy — tránh
# việc một nhánh đang làm dở cũng chiếm runner và đẩy image lên registry.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - when: never

default:
  tags: ['foxai-build']

variables:
  # Một image cho API, một cho web (nginx tĩnh). Thẻ = SHA ngắn của commit:
  # mỗi lần triển khai chỉ đúng một mã nguồn, không dùng `latest` mơ hồ.
  ANH_API: '$CI_REGISTRY_IMAGE/api'
  ANH_WEB: '$CI_REGISTRY_IMAGE/web'
  THE: '$CI_COMMIT_SHORT_SHA'
  # Thư mục GDOS trên máy thử, cùng lệ với các dự án khác ở /opt/foxai/*.
  # Trong đó phải có sẵn `.env` do kỹ thuật đặt một lần — xem chú thích job deploy.
  THU_MUC: '/opt/foxai/gdos'

build:
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # `--cache-from` thẻ develop của lần trước: lớp `pnpm install` không đổi thì
    # dùng lại, khỏi tải lại toàn bộ phụ thuộc mỗi lần đẩy.
    - docker pull "$ANH_API:develop" || true
    - docker pull "$ANH_WEB:develop" || true
    - >-
      docker build --pull --file apps/api/Dockerfile
      --cache-from "$ANH_API:develop" --build-arg BUILDKIT_INLINE_CACHE=1
      --build-arg PHIEN_BAN="$CI_COMMIT_SHORT_SHA"
      --tag "$ANH_API:$THE" --tag "$ANH_API:develop" .
    - >-
      docker build --pull --file apps/web/Dockerfile
      --cache-from "$ANH_WEB:develop" --build-arg BUILDKIT_INLINE_CACHE=1
      --tag "$ANH_WEB:$THE" --tag "$ANH_WEB:develop" .
    - docker push "$ANH_API:$THE"
    - docker push "$ANH_API:develop"
    - docker push "$ANH_WEB:$THE"
    - docker push "$ANH_WEB:develop"

# ── deploy ───────────────────────────────────────────────────────────────────
# BẤM TAY (`when: manual`) — máy thử không tự đổi sau mỗi commit.
#
# Chạy bằng runner `foxai-develop` NẰM NGAY TRÊN MÁY THỬ, nên không cần biến
# CI/CD nào cả. Thứ duy nhất phải chuẩn bị một lần trên máy thử:
#
#   mkdir -p /opt/foxai/gdos/.du-lieu/tep
#   chown -R 1000:1000 /opt/foxai/gdos/.du-lieu/tep   # API chạy non-root (uid 1000)
#   /opt/foxai/gdos/.env  (chmod 600, của gitlab-runner) gồm:
#       POSTGRES_PASSWORD · AUTH_SECRET · MINIO_ROOT_USER · MINIO_ROOT_PASSWORD
#       TIN_PROXY=172.31.0.0/16 · NATIVE_URL=
#
# Bí mật nằm trên máy thử, KHÔNG đi qua CI và không ai phải dán vào GitLab.
deploy:
  stage: deploy
  tags: ['foxai-develop']
  when: manual
  environment:
    name: may-thu
    url: https://gdosfox.fox.ai.vn
  script:
    - |
      # Thiếu chuẩn bị thì DỪNG và nói rõ thiếu gì — không tự tạo .env, vì .env
      # tự tạo nghĩa là mật khẩu do CI sinh và nằm trong log.
      [ -d "$THU_MUC" ] || { echo "✗ Chưa có $THU_MUC trên máy thử" >&2; exit 1; }
      [ -f "$THU_MUC/.env" ] || { echo "✗ Thiếu $THU_MUC/.env — xem chú thích job deploy" >&2; exit 1; }
    - cp compose.trien-khai.yaml "$THU_MUC/compose.yaml"
    - |
      cd "$THU_MUC"
      # Vé của job, hết hiệu lực khi job xong; qua stdin để không hiện trong
      # danh sách tiến trình của máy thử.
      printf '%s' "$CI_JOB_TOKEN" | docker login --username gitlab-ci-token --password-stdin "$CI_REGISTRY"
      # Thẻ image tách khỏi .env (bí mật) — mọi lệnh compose đọc CẢ HAI file.
      printf 'ANH_API=%s\nANH_WEB=%s\nTHE=%s\n' "$ANH_API" "$ANH_WEB" "$THE" > .the-anh
      DC="docker compose --env-file .env --env-file .the-anh"
      $DC pull
      $DC run --rm di-tru
      $DC up --detach --remove-orphans
      docker logout "$CI_REGISTRY"
    - |
      # Chỉ báo xong khi ĐI HẾT chuỗi thật: nginx → api → Postgres.
      cd "$THU_MUC"
      for _ in $(seq 1 30); do
        if curl --fail --silent --output /dev/null http://127.0.0.1:8080/api/health/deps; then
          echo "✓ Máy thử đã chạy bản $THE — https://gdosfox.fox.ai.vn"
          exit 0
        fi
        sleep 2
      done
      echo "✗ Sau 60 giây /api/health/deps vẫn chưa ok — nhật ký API:" >&2
      docker compose --env-file .env --env-file .the-anh logs --tail 60 api >&2
      exit 1
