# ============================================================================
# GDOS — GitLab CI
#
#   kiem-tra   lint · kiểm dữ liệu thật · định dạng · kiểu · test · build
#   bao-mat    gitleaks (bí mật lọt vào lịch sử git) · pnpm audit
#
# Stage đóng gói image + triển khai thuộc Mốc 2, dựng theo mẫu nhánh develop
# của repo foxai-gdos cũ (build SRV-01 → deploy SRV-03, deploy bấm tay).
#
# ⚠ CHƯA KIỂM TRÊN RUNNER THẬT. File này viết cho runner kiểu docker executor
#   (có dùng `image:`). Nếu FOXAI chỉ có shell runner (tag foxai-build như repo
#   cũ) thì phải sửa trước lần push đầu — xem docs/tien-do.md.
# ============================================================================

stages:
  - kiem-tra
  - bao-mat

variables:
  PNPM_VERSION: '11.12.0'

.node:
  image: node:24-alpine
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

kiem-tra:
  extends: .node
  stage: kiem-tra
  script:
    - pnpm lint
    - pnpm format:check
    - pnpm typecheck
    - pnpm test
    - pnpm build

gitleaks:
  stage: bao-mat
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: ['']
  variables:
    GIT_DEPTH: '0' # quét TOÀN BỘ lịch sử — bí mật đã commit rồi xoá vẫn còn trong lịch sử
  script:
    - gitleaks git --redact --verbose .

audit:
  extends: .node
  stage: bao-mat
  script:
    # Chỉ phụ thuộc chạy thật (--prod), chặn ở mức high trở lên.
    - pnpm audit --prod --audit-level high
