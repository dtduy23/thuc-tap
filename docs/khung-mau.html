<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xOS — Khung mẫu phân hệ</title>
<!--
  ============================================================================
  xOS — KHUNG MẪU PHÂN HỆ  (bản mẫu tự chứa, không cần build, không gọi mạng)

  Dựng thành hình cái MINDSET phân nhóm module dùng chung cho cả họ sản phẩm
  (GDOS · EAOS · HDOS · PMS · IOC), để nhân viên NHÌN thấy khung.

  Căn cứ:
    - GDOS  https://gitlab.foxai.com.vn/dangnm/foxai-gdos  (registry một tệp)
    - PMS   https://gitlab.foxai.com.vn/fox/pms            (4 vai × cờ quản trị,
            timeline engine, KPI 100 điểm, SLA NĐ 45, nhật ký thao tác)

  CÂY BỐN CẤP
    Cấp 1  TẦNG       Nghiệp vụ | Quản trị hệ thống
    Cấp 2  NHÓM       Tầng 1: Điều hành · Tác nghiệp · Danh mục · Giám sát & Lưu vết
                      Tầng 2: Người dùng & Phân quyền · Kết nối · Cấu hình & Vận hành
    Cấp 3  MODULE     một ĐỐI TƯỢNG nghiệp vụ (Dự án, Đơn thư, Tài khoản…)
    Cấp 4  CHỨC NĂNG  các ĐƯỜNG VÀO khác nhau của CÙNG đối tượng đó:
                      một bộ lọc · một giai đoạn · một thao tác.
                      Là đối tượng mới thì phải lên cấp 3, không nhét vào cấp 4.

  KHÔNG có cấp 5. Thẻ bên trong một hồ sơ (checklist, giải ngân…) là trục
  PHẠM VI — phải mở hồ sơ trước — chứ không phải độ sâu của cây.

  Không nhúng mật khẩu thật. Không có dữ liệu của người thật.
  ============================================================================
-->
<style>
:root{
  --brand:#1B66E0; --brand-dim:#1552bb; --tint-brand:#e8f0fe;
  --ok:#0f9d58; --tint-ok:#e6f4ec;
  --warn:#e8a33d; --tint-warn:#fdf3e3;
  --danger:#d93025; --tint-danger:#fce8e6;
  --tim:#7c4dff; --tint-tim:#f0eaff;
  --bg:#eef1f6; --nen:#ffffff; --nen-2:#f7f9fc;
  --ink:#16222e; --body:#41505f; --faint:#8494a5;
  --line:#dfe5ec; --line-2:#eef2f7;
  --nav-hover:#f0f4fa; --nav-active:var(--tint-brand);
  --shadow:0 1px 2px rgba(16,34,54,.06), 0 4px 16px rgba(16,34,54,.06);
  --r:10px;
}
:root[data-theme="dark"]{
  --brand:#5b9bff; --brand-dim:#3f7fe0; --tint-brand:#16273f;
  --ok:#4cc38a; --tint-ok:#123024;
  --warn:#e0a458; --tint-warn:#33260f;
  --danger:#ff6b60; --tint-danger:#3a1714;
  --tim:#a98bff; --tint-tim:#241a3d;
  --bg:#0e141b; --nen:#161e27; --nen-2:#1b242f;
  --ink:#e8eef5; --body:#b3c0cd; --faint:#7d8c9c;
  --line:#26313d; --line-2:#1f2831;
  --nav-hover:#1d2833; --nav-active:var(--tint-brand);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--brand);text-decoration:none}
code{font-size:.92em;background:var(--nen-2);border:1px solid var(--line-2);padding:0 4px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Đăng nhập ─────────────────────────────────────────────────────────── */
#dangnhap{position:fixed;inset:0;display:grid;place-items:center;padding:20px;z-index:60;
  background:radial-gradient(1100px 520px at 12% -10%,#24457a 0%,transparent 60%),radial-gradient(900px 520px at 100% 110%,#123055 0%,transparent 58%),#0d1723}
.the-dn{width:100%;max-width:412px;background:var(--nen);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.42);padding:30px 28px 24px}
.dn-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.dn-mark{width:38px;height:38px;border-radius:9px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.dn-ten{font-weight:700;font-size:16px;line-height:1.15}
.dn-phu{font-size:11.5px;color:var(--faint)}
.truong{margin-bottom:13px}
.truong label{display:block;font-size:12.5px;color:var(--body);margin-bottom:5px;font-weight:600}
.truong input,.truong select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--nen-2)}
.o-chon{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--body);margin:-2px 0 15px;cursor:pointer}
.o-chon input{width:15px;height:15px;accent-color:var(--brand)}
.nut{width:100%;padding:10px;border-radius:8px;background:var(--brand);color:#fff;font-weight:600}
.nut:hover{background:var(--brand-dim)}
.dn-ghichu{margin-top:16px;padding:10px 12px;border-radius:8px;background:var(--nen-2);border:1px solid var(--line-2);font-size:11.5px;color:var(--faint);line-height:1.55}

/* ── Vỏ ────────────────────────────────────────────────────────────────── */
#ung-dung{display:none;height:100%;flex-direction:column}
#ung-dung.hien{display:flex}
.thanh-tren{height:54px;flex:none;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--nen);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:9px;width:252px;flex:none}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px}
.logo-ten{font-weight:700;font-size:14.5px;line-height:1.1}
.logo-phu{font-size:10.5px;color:var(--faint)}
.tim-kiem{flex:1;max-width:520px;position:relative}
.tim-kiem input{width:100%;padding:7px 11px 7px 32px;border:1px solid var(--line);border-radius:8px;background:var(--nen-2)}
.tim-kiem svg{position:absolute;left:9px;top:8px;color:var(--faint)}
.kq-tim{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--nen);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:30;padding:5px}
.kq-tim button{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:6px;font-size:13px}
.kq-tim button:hover{background:var(--nav-hover)}
.kq-nhom{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;padding:7px 9px 3px}
.tt-phai{margin-left:auto;display:flex;align-items:center;gap:8px}
.nut-vo{padding:6px 10px;border-radius:8px;color:var(--body);font-size:12.5px;display:flex;align-items:center;gap:6px;position:relative}
.nut-vo:hover{background:var(--nav-hover)}
.cham{position:absolute;top:3px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.nguoi{display:flex;align-items:center;gap:8px;padding-left:10px;border-left:1px solid var(--line)}
.nguoi-ten{font-size:12.5px;font-weight:600;line-height:1.2}
.nguoi-vai{font-size:10.5px;color:var(--faint)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--tint-brand);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:12px}
.than{flex:1;display:flex;min-height:0}

/* ── CÂY BỐN CẤP ───────────────────────────────────────────────────────── */
.canh{width:252px;flex:none;background:var(--nen);border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 24px}
.cay-cong{display:flex;gap:4px;padding:0 2px 6px}
.cay-cong button{flex:1;font-size:11px;color:var(--faint);padding:5px 4px;border-radius:6px;border:1px solid var(--line-2)}
.cay-cong button:hover{background:var(--nav-hover);color:var(--body)}
.mui{width:12px;height:12px;flex:none;transition:transform .15s;opacity:.65}
.dong > .mui{transform:rotate(-90deg)}

/* Cấp 1 — Tầng */
.c1{display:flex;align-items:center;gap:6px;width:100%;padding:11px 6px 2px;text-align:left;
  font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--brand)}
.c1.t2{color:var(--tim)}
.c1 .bar{width:3px;height:12px;border-radius:2px;background:currentColor;flex:none}
.c1-hoi{padding:0 8px 3px 27px;font-size:10.5px;color:var(--faint);font-style:italic;line-height:1.4}
/* Cấp 2 — Nhóm */
.c2{display:flex;align-items:center;gap:6px;width:100%;padding:8px 6px 3px 12px;text-align:left;
  font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint)}
.c2:hover{color:var(--body)}
/* Cấp 3 — Module */
.c3{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px 6px 12px;border-radius:8px;text-align:left;font-size:13px;color:var(--body)}
.c3:hover{background:var(--nav-hover)}
.c3.co-chon{color:var(--ink);font-weight:600}
.c3 .ico{width:16px;flex:none;opacity:.85}
.c3 .nhan{flex:1;min-width:0}
.c3 .so{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:9px;background:var(--tint-danger);color:var(--danger)}
/* Cấp 4 — Chức năng */
.c4-khung{margin:1px 0 5px 27px;border-left:1px solid var(--line);padding-left:6px}
.c4{display:block;width:100%;padding:5px 8px;border-radius:6px;text-align:left;font-size:12.5px;color:var(--body)}
.c4:hover{background:var(--nav-hover)}
.c4.chon{background:var(--nav-active);color:var(--brand);font-weight:600}
.vach{height:1px;background:var(--line-2);margin:12px 6px 4px}

/* ── Nội dung ──────────────────────────────────────────────────────────── */
.chinh{flex:1;overflow-y:auto;padding:18px 22px 40px;min-width:0}
.duong-dan{font-size:11.5px;color:var(--faint);margin-bottom:5px;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.duong-dan .cap{font-size:9.5px;font-weight:700;padding:0 5px;border-radius:4px;background:var(--nen-2);border:1px solid var(--line);color:var(--faint)}
.tieu-de{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.tieu-de h1{font-size:21px;margin:0 0 3px;letter-spacing:-.2px}
.tieu-de p{margin:0;font-size:12.5px;color:var(--faint);max-width:72ch}
.td-nut{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center}
.nut-nho{padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px;color:var(--body);background:var(--nen)}
.nut-nho:hover{background:var(--nav-hover)}
.nut-nho.chinh-yeu{background:var(--brand);color:#fff;border-color:var(--brand)}
.nut-nho.chinh-yeu:hover{background:var(--brand-dim)}
.the{background:var(--nen);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.the-dau{padding:12px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.the-dau h2{font-size:14px;margin:0;font-weight:650}
.the-dau .phu{font-size:11.5px;color:var(--faint)}
.the-than{padding:15px}
.the-than.khit{padding:0}
.luoi{display:grid;gap:14px}
.c4g{grid-template-columns:repeat(4,1fr)} .c3g{grid-template-columns:repeat(3,1fr)} .c2g{grid-template-columns:repeat(2,1fr)}
@media(max-width:1180px){.c4g{grid-template-columns:repeat(2,1fr)}.c3g{grid-template-columns:repeat(2,1fr)}}
/* Màn hẹp: sidebar KHÔNG được biến mất — thành ngăn kéo mở bằng nút ☰.
   Ẩn hẳn là người dùng mất đường đi, cây bốn cấp thành vô nghĩa. */
.nut-menu{display:none}
@media(max-width:780px){
  .c4g,.c3g,.c2g{grid-template-columns:1fr}
  .chinh{padding:14px}
  .nut-menu{display:flex}
  .logo{width:auto} .logo-ten,.logo-phu{display:none}
  .nguoi > div:not(.avatar){display:none}
  .tim-kiem{min-width:0}
  .canh{position:fixed;top:54px;left:0;bottom:0;z-index:45;transform:translateX(-105%);transition:transform .18s;box-shadow:var(--shadow)}
  .canh.mo{transform:none}
}
.kpi{background:var(--nen);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .nhan{font-size:11.5px;color:var(--faint);margin-bottom:6px}
.kpi .so{font-size:25px;font-weight:700;letter-spacing:-.5px;line-height:1}
.kpi .duoi{font-size:11.5px;color:var(--body);margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;font-weight:650;color:var(--body);background:var(--nen-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:hover{background:var(--nav-hover)}
tbody tr.bam{cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--tint-ok);color:var(--ok)}
.chip.warn{background:var(--tint-warn);color:#a9742a}
.chip.danger{background:var(--tint-danger);color:var(--danger)}
.chip.brand{background:var(--tint-brand);color:var(--brand)}
.chip.tim{background:var(--tint-tim);color:var(--tim)}
.chip.xam{background:var(--nen-2);color:var(--faint);border:1px solid var(--line)}
.thanh-tien{height:6px;border-radius:4px;background:var(--line-2);overflow:hidden;min-width:70px}
.thanh-tien i{display:block;height:100%;background:var(--brand);border-radius:4px}
.trong{padding:34px 20px;text-align:center;color:var(--faint);font-size:12.8px;line-height:1.7}
.tab{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow-x:auto}
.tab button{padding:8px 13px;font-size:13px;color:var(--body);border-bottom:2px solid transparent;white-space:nowrap}
.tab button.chon{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.hang-viec{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line-2)}
.hang-viec:last-child{border-bottom:0}
.hv-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:700}
.hv-noi{flex:1;min-width:0}
.hv-tieu{font-size:13px;font-weight:600;margin-bottom:1px}
.hv-phu{font-size:11.5px;color:var(--faint)}
.ghi-chu{border-left:3px solid var(--brand);background:var(--tint-brand);padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--body);margin-bottom:16px;line-height:1.6}
.ghi-chu b{color:var(--ink)}
.tro-ly-nut{position:fixed;right:20px;bottom:20px;width:50px;height:50px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(27,102,224,.42);z-index:40}
.tro-ly-bang{position:fixed;right:20px;bottom:80px;width:330px;max-height:440px;background:var(--nen);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:40;display:none;flex-direction:column;overflow:hidden}
.tro-ly-bang.hien{display:flex}
.tl-dau{padding:11px 14px;border-bottom:1px solid var(--line-2);font-weight:650;font-size:13px;display:flex;align-items:center;gap:8px}
.tl-than{flex:1;overflow-y:auto;padding:13px 14px;font-size:12.5px;color:var(--body);line-height:1.6}
.tl-goi{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tl-goi button{padding:5px 10px;border-radius:14px;background:var(--nen-2);border:1px solid var(--line);font-size:11.5px;color:var(--body)}
.lop-phu{position:fixed;inset:0;background:rgba(9,17,26,.5);z-index:50;display:none;padding:26px;overflow:auto}
.lop-phu.hien{display:block}
.hop{max-width:1040px;margin:0 auto;background:var(--nen);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.hop-dau{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.hop-dau h2{margin:0;font-size:15px}
.hop-than{padding:18px;max-height:calc(100vh - 150px);overflow:auto}
.the-mod{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--nen)}
.the-mod h4{margin:0 0 2px;font-size:13px;display:flex;align-items:center;gap:6px}
.the-mod .mo{font-size:11px;color:var(--faint);line-height:1.45;margin-bottom:7px}
.the-mod button{display:block;width:100%;text-align:left;font-size:12px;padding:3px 0 3px 10px;border-left:1px solid var(--line);color:var(--body)}
.the-mod button:hover:not([disabled]){color:var(--brand)}
.the-mod button[disabled]{opacity:.4;cursor:default}
.lgd{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:11.5px;color:var(--faint);margin-top:10px}
.lgd span{display:flex;align-items:center;gap:5px}
.o{width:9px;height:9px;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<!-- ══════════════════ ĐĂNG NHẬP ══════════════════ -->
<div id="dangnhap">
  <form class="the-dn" onsubmit="vaoHe(event)">
    <div class="dn-logo">
      <div class="dn-mark">xOS</div>
      <div><div class="dn-ten">Nền tảng điều hành số</div><div class="dn-phu">Khung mẫu phân hệ · FOXAI</div></div>
    </div>
    <div class="truong">
      <label for="dn-vai">Đăng nhập với vai</label>
      <select id="dn-vai" onchange="$('#dn-qt').checked = this.value === 'so'">
        <option value="lanh-dao">Lãnh đạo tỉnh — xem toàn bộ</option>
        <option value="so" selected>Sở KH&amp;CN — toàn quyền nghiệp vụ</option>
        <option value="chu-dau-tu">Chủ đầu tư — dự án của đơn vị</option>
        <option value="nha-thau">Nhà thầu — gói thầu tham gia</option>
      </select>
    </div>
    <label class="o-chon"><input type="checkbox" id="dn-qt" checked /> Kèm cờ <b>quản trị hệ thống</b> — mở Tầng 2</label>
    <div class="truong"><label for="dn-tk">Tài khoản</label><input id="dn-tk" value="nguoidung.demo" autocomplete="username" /></div>
    <div class="truong"><label for="dn-mk">Mật khẩu</label><input id="dn-mk" type="password" value="demo" autocomplete="current-password" /></div>
    <button class="nut" type="submit">Đăng nhập</button>
    <div class="dn-ghichu">
      Bản mẫu chạy tại máy, <b>không gọi mạng và không nhúng mật khẩu thật</b>. Mật khẩu nào cũng vào được.
      <b>Vai nghiệp vụ × cờ quản trị độc lập</b>, đúng mô hình PMS: vai quyết định Tầng 1, cờ quyết định Tầng 2.
    </div>
  </form>
</div>

<!-- ══════════════════ ỨNG DỤNG ══════════════════ -->
<div id="ung-dung">
  <header class="thanh-tren">
    <button class="nut-vo nut-menu" onclick="$('#canh').classList.toggle('mo')" title="Mở cây phân hệ" aria-label="Mở cây phân hệ">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="logo">
      <div class="logo-mark">xOS</div>
      <div><div class="logo-ten">Nền tảng điều hành số</div><div class="logo-phu" id="tt-donvi">—</div></div>
    </div>

/* ══════════════════════════════════════════════════════════════════════════
   TRẠNG THÁI + TIỆN ÍCH
   ══════════════════════════════════════════════════════════════════════════ */
let PHIEN = null, MAN = null, HOSO = null, THE_HS = 'hs-checklist';
let MO = {};   // trạng thái mở/đóng từng nút của cây

const $   = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tien = (n) => n.toLocaleString('vi-VN');
const duoc = (q) => !q || (PHIEN && PHIEN.quyen.includes(q));
const khongDau = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase();
const MUI = '<svg class="mui" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m6 9 6 6 6-6"/></svg>';

const NHAN_TT   = { 'dung-han':['ok','Đúng hạn'], 'sap-han':['warn','Sắp hạn'], 'qua-han':['danger','Quá hạn'], 'hoan-thanh':['brand','Hoàn thành'] };
const NHAN_BUOC = { xong:['ok','Hoàn thành'], tre:['danger','Trễ hạn'], dang:['brand','Đang làm'], cho:['xam','Chưa tới'] };
const NHAN_NGUON= { api:['tim','Native'], db:['ok','Postgres xOS'] };

/* Cây: mặc định mở cấp 1 và cấp 2, đóng cấp 3 — trừ nhánh đang xem. */
function dangMo(k){
  if (k in MO) return MO[k];
  return k.startsWith('t:') || k.startsWith('g:');
}
function luuMo(){ try { localStorage.setItem('xos-cay', JSON.stringify(MO)); } catch {} }
function napMo(){ try { MO = JSON.parse(localStorage.getItem('xos-cay') || '{}') || {}; } catch { MO = {}; } }
function doiMo(k){ MO[k] = !dangMo(k); luuMo(); veCanh(); }
function moToTien(laId){
  const c = timLa(laId); if (!c) return;
  const n = nhomCua(c.cha.nhom);
  MO['t:' + n.tang] = true; MO['g:' + n.ma] = true; MO['m:' + c.cha.id] = true; luuMo();
}
function moHet(mo){
  for (const t of TANG) MO['t:' + t.so] = true;          // tầng luôn mở, để còn thấy khung
  for (const n of NHOM) MO['g:' + n.ma] = mo;
  for (const m of MODULE) MO['m:' + m.id] = mo;
  luuMo(); veCanh();
}

/* Những chức năng vai này được thấy, theo đúng thứ tự cây */
const laDuoc = () => LA.filter(c => duoc(c.quyen));

/* ── Đăng nhập ─────────────────────────────────────────────────────────── */
function vaoHe(e){
  e.preventDefault();
  const ma = $('#dn-vai').value, v = VAI[ma], qt = $('#dn-qt').checked;
  PHIEN = { ma, ten:$('#dn-tk').value || 'Người dùng demo', vai:v.ten + (qt ? ' · Quản trị' : ''),
            donVi:v.donVi, quyen: qt ? [...v.quyen, ...QUYEN_QT] : v.quyen };
  $('#dangnhap').style.display = 'none';
  $('#ung-dung').classList.add('hien');
  $('#tro-ly-nut').style.display = 'grid';
  $('#tt-ten').textContent = PHIEN.ten; $('#tt-vai').textContent = PHIEN.vai;
  $('#tt-donvi').textContent = PHIEN.donVi; $('#tt-chu').textContent = PHIEN.vai.charAt(0);
  napMo();
  // Màn đầu = chức năng ĐẦU TIÊN vai này có quyền. Không cứng "Tổng quan":
  // nhà thầu không có DASHBOARD.READ thì phải vào Dự án, không phải trang trắng.
  const dau = laDuoc()[0];
  MAN = dau ? dau.id : null; HOSO = null;
  if (MAN) moToTien(MAN);
  veCanh(); veChinh(); veTroLy();
}
function thoat(){
  PHIEN = null; HOSO = null;
  $('#ung-dung').classList.remove('hien'); $('#tro-ly-nut').style.display = 'none';
  $('#tro-ly-bang').classList.remove('hien'); $('#dangnhap').style.display = 'grid';
}
function doiNen(){
  const r = document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

/* ══════════════════════════════════════════════════════════════════════════
   SIDEBAR — CÂY BỐN CẤP, sinh từ registry, lọc theo quyền ở MỌI cấp.
   Nút nào không còn con nào được thấy thì tự ẩn, kể cả tiêu đề tầng.
   ══════════════════════════════════════════════════════════════════════════ */
function veCanh(){
  let h = `<div class="cay-cong">
    <button onclick="moHet(true)">Mở rộng tất cả</button>
    <button onclick="moHet(false)">Thu gọn tất cả</button></div>`;

  for (const t of TANG){
    const nhoms = NHOM.filter(n => n.tang === t.so).map(n => [n,
        MODULE.filter(m => m.nhom === n.ma)
              .map(m => [m, m.con.filter(c => duoc(c.quyen || m.quyen))])
              .filter(([, cs]) => cs.length)])
      .filter(([, ms]) => ms.length);
    if (!nhoms.length) continue;

    const k1 = 't:' + t.so, mo1 = dangMo(k1);
    if (t.so === 2) h += '<div class="vach"></div>';
    h += `<button class="c1 t${t.so} ${mo1 ? '' : 'dong'}" onclick="doiMo('${k1}')" aria-expanded="${mo1}">
            ${MUI}<span class="bar"></span><span>${esc(t.nhan)}</span></button>`;
    if (!mo1) continue;
    h += `<div class="c1-hoi">${esc(t.hoi)}</div>`;

    for (const [n, ms] of nhoms){
      const k2 = 'g:' + n.ma, mo2 = dangMo(k2);
      h += `<button class="c2 ${mo2 ? '' : 'dong'}" onclick="doiMo('${k2}')" title="${esc(n.hoi)}" aria-expanded="${mo2}">
              ${MUI}<span>${esc(n.nhan)}</span></button>`;
      if (!mo2) continue;

      for (const [m, cs] of ms){
        const k3 = 'm:' + m.id, mo3 = dangMo(k3);
        const chua = !HOSO && cs.some(c => c.id === MAN) || (HOSO && m.id === 'du-an');
        const so = m.id === 'du-an' ? DUAN.filter(d => d.tt === 'qua-han').length
                 : m.id === 'don-thu' ? DONTHU.filter(d => d.con !== null && d.con <= 0).length : 0;
        h += `<button class="c3 ${mo3 ? '' : 'dong'} ${chua ? 'co-chon' : ''}" onclick="bamModule('${m.id}')"
                title="${esc(m.mo)}" aria-expanded="${mo3}">
                <span class="ico">${bieuTuong(m.nhom)}</span>
                <span class="nhan">${esc(m.nhan)}</span>
                ${so ? `<span class="so tnum">${so}</span>` : ''}${MUI}</button>`;
        if (!mo3) continue;
        h += '<div class="c4-khung">';
        for (const c of cs)
          h += `<button class="c4 ${!HOSO && MAN === c.id ? 'chon' : ''}" onclick="di('${c.id}')">${esc(c.nhan)}</button>`;
        h += '</div>';
      }
    }
  }
  const thay = laDuoc().length;
  h += `<div class="vach"></div>
    <div style="padding:0 10px;font-size:11px;color:var(--faint);line-height:1.6">
      Vai <b style="color:var(--body)">${esc(PHIEN.vai)}</b><br>
      Thấy ${thay} chức năng · ẩn ${LA.length - thay} do thiếu quyền
    </div>`;
  $('#canh').innerHTML = h;
  $('#cham-viec').textContent = VIEC.filter(v => { const c = timLa(v.la); return c && duoc(c.quyen); }).length;
}

/* Bấm module cấp 3: mở ra và vào chức năng đầu tiên; bấm lần nữa khi đang ở trong thì thu lại. */
function bamModule(id){
  const m = MODULE.find(x => x.id === id), k = 'm:' + id;
  const cs = m.con.filter(c => duoc(c.quyen || m.quyen));
  const dangTrong = !HOSO && cs.some(c => c.id === MAN);
  if (dangMo(k) && dangTrong){ MO[k] = false; luuMo(); veCanh(); return; }
  MO[k] = true; luuMo();
  if (!dangTrong) di(cs[0].id, true); else veCanh();
}

function bieuTuong(nhom){
  const n = nhomCua(nhom), k = n && n.tang === 2 ? 'quan-tri' : nhom;
  const d = {
    'dieu-hanh':'<path d="M3 3v18h18"/><path d="m7 15 4-5 3 3 5-7"/>',
    'tac-nghiep':'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
    'danh-muc':'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',
    'giam-sat':'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    'quan-tri':'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  }[k] || '<circle cx="12" cy="12" r="9"/>';
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${d}</svg>`;
}

/* ── Điều hướng ────────────────────────────────────────────────────────── */
/* giuMenu: bấm module cấp 3 trên màn hẹp thì ngăn kéo phải mở tiếp để chọn cấp 4. */
function di(id, giuMenu){
  HOSO = null; MAN = id;
  if (id !== 'viec-cua-toi') moToTien(id);
  if (!giuMenu) $('#canh').classList.remove('mo');
  veCanh(); veChinh(); $('#chinh').scrollTop = 0; dongTim();
}
function moHoSo(ma){
  HOSO = DUAN.find(d => d.ma === ma); THE_HS = 'hs-checklist';
  MO['t:1'] = true; MO['g:tac-nghiep'] = true; MO['m:du-an'] = true; luuMo();
  $('#canh').classList.remove('mo');
  veCanh(); veChinh(); $('#chinh').scrollTop = 0; dongTim();
}

/* ── Tìm kiếm toàn cục (ở VỎ) ──────────────────────────────────────────── */
function timKiem(q){
  const box = $('#kq-tim'), t = khongDau(q.trim());
  if (!t){ box.style.display = 'none'; return; }
  const las = laDuoc().filter(c => khongDau(c.nhan + ' ' + c.cha.nhan + ' ' + (c.mo || c.cha.mo)).includes(t)).slice(0, 7);
  const das = duoc('PROJECT.READ') ? DUAN.filter(d => khongDau(d.ten + ' ' + d.ma).includes(t)).slice(0, 4) : [];
  const dts = duoc('COMPLAINT.READ') ? DONTHU.filter(d => khongDau(d.nd + ' ' + d.ma).includes(t)).slice(0, 3) : [];
  let h = '';
  if (las.length){ h += '<div class="kq-nhom">Chức năng</div>';
    for (const c of las) h += `<button onclick="di('${c.id}')"><span style="color:var(--faint)">${esc(c.cha.nhan)} ›</span> ${esc(c.nhan)}</button>`; }
  if (das.length){ h += '<div class="kq-nhom">Dự án</div>';
    for (const d of das) h += `<button onclick="moHoSo('${d.ma}')"><b class="tnum">${d.ma}</b> — ${esc(d.ten)}</button>`; }
  if (dts.length){ h += '<div class="kq-nhom">Đơn thư</div>';
    for (const d of dts) h += `<button onclick="di('dt-${d.gd}')"><b class="tnum">${esc(d.ma)}</b> — ${esc(d.nd)}</button>`; }
  box.innerHTML = h || '<div class="kq-nhom">Không có kết quả</div>'; box.style.display = 'block';
}
function dongTim(){ $('#kq-tim').style.display = 'none'; $('#o-tim').value = ''; }
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); $('#o-tim').focus(); }
  if (e.key === 'Escape'){ dongTim(); dongPhu(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.tim-kiem')) $('#kq-tim').style.display = 'none'; });

const VE = {
  tongQuan:()=>veTongQuan, duAn:()=>veDuAn, donDoc:()=>veDonDoc, donThu:()=>veDonThu,

function veViec(){
  const moc = [['qua-han','Quá hạn','danger'], ['hom-nay','Hôm nay','warn'], ['sap-toi','Sắp tới','brand']];
  let h = `<div class="duong-dan">VỎ · không thuộc cây</div>
    <div class="tieu-de"><div><h1>Việc của tôi</h1>
    <p>Gom từ mọi module. Xếp theo <b>mốc thời gian trước</b>, trong mỗi mốc mới chia theo module — vì câu hỏi thật của cán bộ là "cái gì sắp chết hạn".</p></div></div>`;
  let co = 0;
  for (const [ma, ten, mau] of moc){
    const ds = VIEC.filter(v => v.moc === ma && duoc((timLa(v.la) || {}).quyen));
    if (!ds.length) continue; co += ds.length;
    h += `<div class="the"><div class="the-dau"><h2>${ten}</h2><span class="chip ${mau}">${ds.length}</span></div><div class="the-than khit">`;

    }

  $('#chinh').innerHTML = co ? h : h + khungTrong('Không có việc nào', 'Vai hiện tại chưa được giao việc nào.');
}

      h += `<div style="font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.5px;text-transform:uppercase;margin:4px 0 6px 9px">
