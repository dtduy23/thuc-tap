# ============================================================================
# MẪU vhost cho nginx CỦA MÁY CHỦ (không phải nginx trong image web).
#
#   https://gdosfox.fox.ai.vn  →  127.0.0.1:8080  (container web)
#
# MÁY THỬ DÙNG aaPanel QUẢN NGINX (/www/server/panel/vhost/nginx/), nên đừng
# chép tay file này vào. Làm trên giao diện aaPanel:
#   Website → Add site (gdosfox.fox.ai.vn) → SSL (xin chứng thư, bật Force HTTPS)
#   → Reverse proxy → http://127.0.0.1:8080
# File này chỉ để biết CẦN những gì: ép HTTPS, chuyền X-Forwarded-For, nới
# client_max_body_size, nới proxy_read_timeout.
#
# ĐƯỜNG DẪN CHỨNG THƯ bên dưới là chỗ trống — điền chứng thư thật của FOXAI
# (chứng thư ký sẵn cho *.fox.ai.vn, hoặc certbot cho riêng tên miền này).
# Không đoán hộ: sai đường dẫn thì nginx không khởi động lại được.
# ============================================================================

server {
  listen 80;
  listen [::]:80;
  server_name gdosfox.fox.ai.vn;

  # Chừa lối cho certbot nếu FOXAI cấp chứng thư bằng Let's Encrypt.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name gdosfox.fox.ai.vn;

  ssl_certificate /etc/ssl/foxai/gdosfox.fox.ai.vn.crt; # ← điền
  ssl_certificate_key /etc/ssl/foxai/gdosfox.fox.ai.vn.key; # ← điền
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # Cookie đăng nhập của GDOS đặt cờ Secure ở production (cau-hinh.ts) — không
  # có HTTPS thì trình duyệt vứt cookie và không ai đăng nhập được.
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 64m; # tải tệp đính kèm lên

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Chuỗi X-Forwarded-For đi tiếp qua nginx trong container rồi tới API. API
    # chỉ tin dải mạng khai ở TIN_PROXY — nginx máy chủ ra vào container bằng
    # cổng nội bộ 172.31.0.1 nên đã nằm trong dải đó, không cần khai thêm.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # tóm tắt văn bản qua Native có thể lâu
  }
}
